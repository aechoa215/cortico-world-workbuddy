name: CI

# 0.3.1：tag 触发交给 release.yml（它内部有 verify → publish 的 needs 依赖），
# 这里只负责日常 push / PR，避免两套工作流各自监听 v* 却互不知情。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check (windows / node ${{ matrix.node }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install devDependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check
        shell: bash
        run: |
          set -e
          for f in src/*.js src/webui/*.js scripts/*.mjs scripts/lib/*.mjs; do
            node --check "$f"
          done

      - name: Contract assertions
        run: node scripts/contract.mjs

      - name: describe.json is generated from source
        run: node scripts/gen-describe.mjs --check

      # dist 必须与源码同步：改了客户端却忘了重建时，这一步会红
      - name: Build webui and verify dist is up to date
        shell: bash
        run: |
          set -e
          node scripts/build-web.mjs --strict
          git diff --exit-code -- dist/ || {
            echo "::error::dist/webui.js 与 src/webui/client.js 不同步，请在本地跑 npm run build:web 后提交"
            exit 1
          }

      # World 契约自检需要宿主框架；CI 没有 Coopanion，允许缺失（改跑离线检查，仍会红叉真失败）
      - name: Extension selfcheck
        run: node scripts/selfcheck.mjs --allow-missing-host

  cross-platform:
    name: cross-platform (ubuntu / node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check (no install)
        shell: bash
        run: |
          set -e
          for f in src/*.js src/webui/*.js scripts/*.mjs scripts/lib/*.mjs; do
            node --check "$f"
          done
          node -e "JSON.parse(require('node:fs').readFileSync('package.json','utf8'));JSON.parse(require('node:fs').readFileSync('describe.json','utf8'));console.log('json ok')"

      - name: Extension selfcheck (host missing is expected)
        run: node scripts/selfcheck.mjs --allow-missing-host

  # 端到端 UI 验证需要本机装好 Coopanion 与 Chrome；CI 上没有就明确跳过。
  visual:
    name: visual (windows, optional)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      - name: verify-ui (skipped unless Coopanion is installed)
        shell: pwsh
        run: |
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Coopanion\resources\app'
          if (-not (Test-Path (Join-Path $app 'build\console\index.html'))) {
            Write-Host '::notice::本机没有 Coopanion，跳过端到端 UI 验证（这类检查只在开发者机器上跑）'
            exit 0
          }
          node scripts/verify-ui.mjs --runs 1
