name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 完整流水线只能在 Windows 上跑：本包的 package.json 声明了 "os": ["win32"]，
  # npm 在 Linux 上会直接 EBADPLATFORM 拒绝安装（这是有意的平台限制，不是配置错误）。
  check:
    name: check (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 有 package-lock.json：devDependencies 只有 esbuild，用 npm ci 保证可复现。
      - name: Install devDependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax check
        shell: bash
        run: |
          set -e
          for f in src/*.js src/webui/*.js scripts/*.mjs; do
            node --check "$f"
          done

      # dist 必须与源码同步：改了客户端却忘了重建时，这一步会红
      - name: Build webui and verify dist is up to date
        shell: bash
        run: |
          set -e
          npm run build:web
          git diff --exit-code -- dist/ || {
            echo "::error::dist/webui.js 与 src/webui/client.js 不同步，请在本地跑 npm run build:web 后提交"
            exit 1
          }

      # World 契约自检需要宿主框架；CI 没有 Coopanion，所以允许缺失（会 warning 但退出 0）
      - name: Extension selfcheck
        run: node scripts/selfcheck.mjs --allow-missing-host

  # Linux 上只做「不安装依赖也能跑」的检查：语法 + 契约自检（无宿主时跳过）。
  # 这样跨平台的问题（大小写、换行、路径分隔符）仍然能被发现。
  cross-platform:
    name: cross-platform (ubuntu-latest / node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check (no install)
        shell: bash
        run: |
          set -e
          for f in src/*.js src/webui/*.js scripts/*.mjs; do
            node --check "$f"
          done
          node -e "JSON.parse(require('node:fs').readFileSync('package.json','utf8'));JSON.parse(require('node:fs').readFileSync('describe.json','utf8'));console.log('json ok')"

      - name: Extension selfcheck (host missing is expected)
        run: node scripts/selfcheck.mjs --allow-missing-host

  # 端到端 UI 验证需要本机装好 Coopanion 与 Chrome。CI 上没有，所以：
  # 没检测到宿主就明确 skip（退出码 0），不让这条红叉造成「哪里坏了」的误会。
  visual:
    name: visual (windows, optional)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund

      - name: verify-ui (skipped unless Coopanion is installed)
        shell: pwsh
        run: |
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Coopanion\resources\app'
          if (-not (Test-Path (Join-Path $app 'build\console\index.html'))) {
            Write-Host '::notice::本机没有 Coopanion，跳过端到端 UI 验证（这类检查只在开发者机器上跑）'
            exit 0
          }
          node scripts/verify-ui.mjs --runs 1
